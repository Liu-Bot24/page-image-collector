<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片采集查看器 - WORKSPACE</title>
  <link rel="stylesheet" href="../styles/workspace.css">
</head>
<body>
  <div class="workspace">
    <!-- 顶部全局控制台 -->
    <header class="console">
      <div class="console-row row-top">
        <div class="top-left">
          <div class="logo">
            <span class="logo-text">图片采集查看器 · WORKSPACE</span>
            <a class="author-signature" href="https://blog.liu-qi.cn/" target="_blank" rel="noopener noreferrer">Created by @liuqi</a>
          </div>
          <label class="switch-toggle switch-accent compact">
            <input type="checkbox" id="toggle-auto-scan">
            <span class="switch-slider" aria-hidden="true"></span>
            <span class="switch-text">自动采集</span>
          </label>
          <div class="stats">
            <span class="stat"><strong id="stat-total">0</strong> 总图片</span>
            <span class="stat"><strong id="stat-filtered">0</strong> 已筛选</span>
            <span class="stat"><strong id="stat-selected">0</strong> 已选中</span>
          </div>
        </div>
      </div>

      <div class="console-row row-config">
          <label class="switch-toggle">
            <input type="checkbox" id="toggle-hd" checked>
            <span class="switch-slider" aria-hidden="true"></span>
            <span class="switch-text">采集原图</span>
          </label>
          <label class="switch-toggle">
            <input type="checkbox" id="toggle-sort-size" checked>
            <span class="switch-slider" aria-hidden="true"></span>
            <span class="switch-text">大到小排序</span>
          </label>
          <label class="switch-toggle">
            <input type="checkbox" id="toggle-portrait-only">
            <span class="switch-slider" aria-hidden="true"></span>
            <span class="switch-text">仅显示竖图</span>
          </label>
          <label class="switch-toggle">
            <input type="checkbox" id="toggle-webp">
            <span class="switch-slider" aria-hidden="true"></span>
            <span class="switch-text">下载转JPG</span>
          </label>
          <label class="switch-toggle">
            <input type="checkbox" id="toggle-batch-zip-download">
            <span class="switch-slider" aria-hidden="true"></span>
            <span class="switch-text">批量下载ZIP</span>
          </label>
      </div>

      <div class="console-row row-resolution">
        <label class="metric-filter">
          <span>布局</span>
          <select id="layout-mode">
            <option value="grid">网格</option>
            <option value="waterfall">瀑布流</option>
          </select>
        </label>
        <label class="metric-filter zoom-control">
          <span>缩放</span>
          <input type="range" id="zoom-slider" min="50" max="200" value="100" step="10">
          <span id="zoom-value" class="zoom-val">100%</span>
        </label>
      </div>

      <div class="console-row row-formats">
        <div class="filter-formats compact" id="format-filters">
          <span class="format-loading">格式统计中...</span>
        </div>
      </div>

      <div class="console-row row-resolution">
        <div class="resolution-presets" id="resolution-presets">
          <button type="button" class="preset-chip active" data-preset="all">全部</button>
          <button type="button" class="preset-chip" data-preset="720p">≥ 720P</button>
          <button type="button" class="preset-chip" data-preset="1080p">≥ 1080P</button>
          <button type="button" class="preset-chip" data-preset="2k">≥ 2K</button>
          <button type="button" class="preset-chip" data-preset="4k">≥ 4K</button>
        </div>
        <div class="filter-group">
          <label class="metric-filter">
            <span>最小短边</span>
            <input type="number" id="filter-min-short" min="0" value="0">
          </label>
          <label class="metric-filter">
            <span>最小长边</span>
            <input type="number" id="filter-min-long" min="0" value="0">
          </label>
          <label class="metric-filter">
            <span>最小像素</span>
            <select id="filter-min-mp">
              <option value="0">不限</option>
              <option value="70000">≥ 0.07 MP</option>
              <option value="500000">≥ 0.50 MP</option>
              <option value="921600">≥ 0.92 MP</option>
              <option value="1000000">≥ 1.00 MP</option>
              <option value="2073600">≥ 2.07 MP</option>
              <option value="3686400">≥ 3.69 MP</option>
              <option value="8294400">≥ 8.29 MP</option>
              <option value="12000000">≥ 12.00 MP</option>
              <option value="24000000">≥ 24.00 MP</option>
            </select>
          </label>
        </div>
      </div>

      <div class="console-row row-actions">
        <button id="btn-scan" class="btn btn-primary">开始扫描</button>
        <button id="btn-clear" class="btn btn-secondary btn-icon-square" type="button" aria-label="清理当前采集结果" title="清理当前采集结果">
          <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3.5v8.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M10 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M7.5 12.2h9v7.3h-9z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M9.8 14.5v3.8M12 14.5v3.8M14.2 14.5v3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="btn-select-all" class="btn btn-neutral">全选</button>
        <button id="btn-hide-toggle" class="btn btn-hide" disabled>隐藏</button>
        <button id="btn-copy-batch" class="btn btn-info">批量复制链接</button>
        <button id="btn-download-batch" class="btn btn-success">批量下载</button>
        <button id="btn-open-download-dir" class="btn btn-secondary">打开下载目录</button>
        <span class="action-status" id="action-status"></span>
      </div>
    </header>

    <section class="comic-banner" id="comic-banner" hidden>
      <div class="comic-banner-copy">
        <div class="comic-banner-title" id="comic-banner-title">漫画模式（实验性）</div>
        <div class="comic-banner-description" id="comic-banner-description">
          <span id="comic-banner-description-text">图片结果会按原网页中的阅读顺序排列。</span>
          <span class="comic-banner-description-note" id="comic-banner-description-note" hidden>注意，如果原网页未完全加载，请 <a href="#" class="comic-banner-link" id="comic-banner-autoscroll-link">将原网页滚动到页面底部</a> 后再返回本页面。</span>
        </div>
        <div class="comic-banner-pagination" id="comic-banner-pagination" hidden>
          <span class="comic-banner-pagination-text" id="comic-banner-pagination-text">检测到原页面可向后翻页，支持获取后续分页图片。</span>
            <label class="comic-banner-pagination-label" for="comic-banner-pagination-limit">立即向后加载</label>
            <select class="comic-banner-pagination-select" id="comic-banner-pagination-limit">
              <option value="12">12</option>
              <option value="24">24</option>
              <option value="36">36</option>
              <option value="48" selected>48</option>
            </select>
            <span class="comic-banner-pagination-suffix">页，</span>
            <label class="comic-banner-pagination-label" for="comic-banner-pagination-wait">每页最长等待加载</label>
            <input
              type="number"
              class="comic-banner-pagination-input"
              id="comic-banner-pagination-wait"
              min="1"
              max="30"
              step="1"
              value="6"
              inputmode="numeric"
            >
            <span class="comic-banner-pagination-suffix">秒</span>
            <button type="button" class="comic-banner-pagination-go" id="comic-banner-pagination-go" aria-label="开始分页查看" title="开始分页查看">
              <svg viewBox="-10 350 1020 400" aria-hidden="true">
                <path d="M77.269333 457.173333c-2.005333 0-2.474667-0.981333-1.493333-2.517333l10.496-13.44c0.981333-1.493333 3.456-2.474667 5.461333-2.474667h178.005334c1.962667 0 2.474667 1.493333 1.493333 2.986667l-8.490667 12.928c-0.981333 1.536-3.498667 2.986667-4.992 2.986667l-180.48-0.469334zM2.005333 503.04c-2.005333 0-2.517333-0.981333-1.493333-2.474667l10.453333-13.482666c0.981333-1.493333 3.498667-2.474667 5.504-2.474667h227.328c2.005333 0 2.986667 1.493333 2.474667 2.986667l-3.968 11.946666c-0.512 2.005333-2.474667 2.986667-4.48 2.986667l-235.818667 0.512z m120.661334 45.866667c-2.005333 0-2.517333-1.493333-1.493334-2.986667l6.954667-12.458667c0.981333-1.493333 2.986667-2.986667 4.992-2.986666h99.712c2.005333 0 2.986667 1.493333 2.986667 3.498666l-0.981334 11.946667c0 2.005333-2.005333 3.498667-3.498666 3.498667l-108.672-0.512z m517.504-100.693334c-31.402667 7.978667-52.864 13.952-83.754667 21.930667-7.509333 1.962667-7.978667 2.474667-14.506667-4.992-7.424-8.490667-12.928-13.952-23.381333-18.944-31.445333-15.445333-61.866667-10.965333-90.24 7.466667-33.92 21.930667-51.370667 54.357333-50.858667 94.72 0.469333 39.893333 27.904 72.789333 67.285334 78.293333 33.92 4.48 62.293333-7.466667 84.778666-32.896 4.48-5.504 8.448-11.477333 13.44-18.474667H446.72c-10.453333 0-12.970667-6.485333-9.472-14.933333 6.485333-15.445333 18.432-41.386667 25.429333-54.357333a13.44 13.44 0 0 1 12.458667-7.978667h181.461333c-0.981333 13.482667-0.981333 26.922667-2.986666 40.405333a212.608 212.608 0 0 1-40.874667 97.706667c-35.882667 47.36-82.773333 76.8-142.08 84.736-48.853333 6.485333-94.250667-2.986667-134.101333-32.853333-36.906667-27.946667-57.856-64.853333-63.317334-110.72-6.485333-54.357333 9.472-103.210667 42.368-146.090667 35.413333-46.336 82.261333-75.776 139.605334-86.229333 46.848-8.490667 91.733333-2.986667 132.096 24.405333 26.453333 17.493333 45.354667 41.386667 57.856 70.314667 2.986667 4.48 0.981333 6.997333-4.992 8.490666m165.034666 275.712c-45.397333-1.024-86.               </svg>
            </button>
        </div>
      </div>
      <label class="switch-toggle switch-accent comic-banner-toggle">
        <input type="checkbox" id="toggle-comic-mode">
        <span class="switch-slider" aria-hidden="true"></span>
        <span class="switch-text">漫画模式</span>
      </label>
    </section>

    <!-- 图片画廊 -->
    <main class="gallery" id="gallery">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">PIC</div>
        <h3>暂无图片</h3>
        <p>点击「扫描」按钮获取本页图片</p>
      </div>
    </main>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-backdrop"></div>
    <div class="lightbox-content">
      <button id="lightbox-prev" class="lightbox-nav lightbox-nav-prev" type="button" aria-label="上一张">‹</button>
      <div class="lightbox-image-stage" id="lightbox-image-stage">
        <img id="lightbox-image" src="" alt="Preview">
      </div>
      <button id="lightbox-next" class="lightbox-nav lightbox-nav-next" type="button" aria-label="下一张">›</button>
      <div class="lightbox-info">
        <div class="lightbox-details">
          <span id="lightbox-dimensions"></span>
          <span id="lightbox-area"></span>
          <span id="lightbox-format"></span>
          <span id="lightbox-mode">预览图</span>
        </div>
        <div class="lightbox-url" id="lightbox-url"></div>
      </div>
      <div class="lightbox-actions">
        <button id="lightbox-download" class="btn btn-success">下载</button>
        <button id="lightbox-copy" class="btn btn-info">复制</button>
        <button id="lightbox-source" class="btn btn-secondary">图片来源</button>
        <button id="lightbox-original" class="btn btn-secondary">查看大图</button>
        <button id="lightbox-fullscreen" class="btn btn-secondary">全屏看图</button>
        <button id="lightbox-close" class="btn btn-secondary">关闭</button>
      </div>
    </div>
  </div>

  <div class="fullscreen-viewer" id="fullscreen-viewer">
    <button id="fullscreen-prev" class="lightbox-nav lightbox-nav-prev" type="button" aria-label="上一张">‹</button>
    <div class="fullscreen-stage" id="fullscreen-stage">
      <img id="fullscreen-image" src="" alt="Fullscreen preview">
      <div class="fullscreen-loading" id="fullscreen-loading">加载中...</div>
    </div>
    <button id="fullscreen-next" class="lightbox-nav lightbox-nav-next" type="button" aria-label="下一张">›</button>
    <button id="fullscreen-close" class="fullscreen-close" type="button" aria-label="关闭全屏">×</button>
  </div>

  <script src="workspace.js"></script>
</body>
</html>

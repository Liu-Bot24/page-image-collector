<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片采集查看器</title>
  <link rel="stylesheet" href="../styles/popup.css">
</head>
<body>
  <div class="popup">
    <header class="console">
      <div class="console-row row-top">
        <div class="top-left">
          <span class="logo-text">图片采集查看器</span>
          <a class="author-signature" href="https://blog.liu-qi.cn/tools/" target="_blank" rel="noopener noreferrer">Created by @liuqi</a>
        </div>
        <div class="language-switch" id="language-switch" role="group" aria-label="Language">
          <button class="language-option" type="button" data-language="en" aria-pressed="false">EN</button>
          <button class="language-option" type="button" data-language="zh" aria-pressed="true">中</button>
        </div>
        <div class="top-right">
          <button id="btn-scan" class="btn btn-primary">开始扫描</button>
          <button id="btn-clear" class="btn btn-secondary btn-icon-square" type="button" aria-label="清理当前采集结果" title="清理当前采集结果">
            <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 3.5v8.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M10 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M7.5 12.2h9v7.3h-9z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M9.8 14.5v3.8M12 14.5v3.8M14.2 14.5v3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
          <button id="btn-workspace" class="btn btn-secondary">打开WORKSPACE</button>
          <button id="btn-comic-mode" class="btn btn-secondary btn-icon-square" type="button" aria-label="进入漫画模式" title="进入漫画模式">
            <svg class="btn-icon-svg" viewBox="64 42 896 896" fill="none" aria-hidden="true">
              <path d="M85.333333 234.666667a170.666667 170.666667 0 0 1 170.666667-170.666667h512a170.666667 170.666667 0 0 1 170.666667 170.666667v490.666666a170.666667 170.666667 0 0 1-170.666667 170.666667H256a170.666667 170.666667 0 0 1-170.666667-170.666667V234.666667z" fill="#FDF6EF"/>
              <path d="M170.666667 277.333333a128 128 0 0 1 128-128h426.666666a128 128 0 0 1 128 128v405.333334a128 128 0 0 1-128 128H298.666667a128 128 0 0 1-128-128V277.333333z" fill="#EF4D43"/>
              <path d="M170.666667 277.333333a128 128 0 0 1 128-128h213.333333v341.333334H170.666667V277.333333z" fill="#000000" fill-opacity=".1"/>
              <path d="M512 149.333333h213.333333a128 128 0 0 1 128 128v213.333334H512V149.333333z" fill="#000000" fill-opacity=".2"/>
              <path d="M405.333333 490.666667h213.333334l85.333333 320H320l85.333333-320z" fill="#5F4441"/>
              <path d="M408.384 290.517333a25.258667 25.258667 0 0 1-18.282667 8.149334c-15.146667 0-27.434667-14.336-27.434666-32s12.288-32 27.434666-32c3.562667 0 6.976 0.789333 10.090667 2.24C403.370667 223.317333 414.016 213.333333 426.666667 213.333333c12.650667 0 23.296 9.984 26.453333 23.573334 3.136-1.450667 6.549333-2.24 10.112-2.24 15.146667 0 27.434667 14.336 27.434667 32s-12.288 32-27.434667 32c-7.018667 0-13.44-3.072-18.282667-8.149334A25.258667 25.258667 0 0 1 426.666667 298.666667c-7.04 0-13.44-3.072-18.282667-8.149334z" fill="#FFFFFF"/>
              <path d="M664.384 674.517333a25.258667 25.258667 0 0 1-18.282667 8.149334c-15.146667 0-27.434667-14.336-27.434666-32s12.288-32 27.434666-32c3.562667 0 6.976 0.789333 10.090667 2.24C659.370667 607.317333 670.016 597.333333 682.666667 597.333333c12.650667 0 23.296 9.984 26.453333 23.573334 3.136-1.450667 6.549333-2.24 10.112-2.24 15.146667 0 27.434667 14.336 27.434667 32s-12.288 32-27.434667 32c-7.018667 0-13.44-3.072-18.282667-8.149334A25.258667 25.258667 0 0 1 682.666667 682.666667c-7.04 0-13.44-3.072-18.282667-8.149334z" fill="#FFFFFF"/>
            </svg>
          </button>
        </div>
      </div>
      
      <div class="console-row row-stats">
        <div class="stats">
          <span class="stat"><strong id="stat-total">0</strong> 总图片</span>
          <span class="stat"><strong id="stat-filtered">0</strong> 已筛选</span>
          <span class="stat"><strong id="stat-selected">0</strong> 已选中</span>
        </div>
        <div class="stat-controls">
          <button id="btn-auto-scroll" class="btn stat-icon-btn" type="button" aria-label="开启自动滚动" aria-pressed="false" title="开启自动滚动">
            <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 4v7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M8.5 10.5L12 14l3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M8.5 15L12 18.5l3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M6.5 3.5h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.68"/>
            </svg>
          </button>
          <label class="switch-toggle switch-accent compact">
            <input type="checkbox" id="toggle-auto-scan">
            <span class="switch-slider" aria-hidden="true"></span>
            <span class="switch-text">自动采集</span>
          </label>
          <label class="switch-toggle switch-accent compact">
            <input type="checkbox" id="toggle-right-click">
            <span class="switch-slider" aria-hidden="true"></span>
            <span class="switch-text">解锁右键</span>
          </label>
        </div>
      </div>

      <div class="console-row row-config">
        <label class="switch-toggle">
          <input type="checkbox" id="toggle-hd" checked>
          <span class="switch-slider" aria-hidden="true"></span>
          <span class="switch-text">采集原图</span>
        </label>
        <label class="switch-toggle">
          <input type="checkbox" id="toggle-sort-size" checked>
          <span class="switch-slider" aria-hidden="true"></span>
          <span class="switch-text">大到小排序</span>
        </label>
        <label class="switch-toggle">
          <input type="checkbox" id="toggle-portrait-only">
          <span class="switch-slider" aria-hidden="true"></span>
          <span class="switch-text">仅显示竖图</span>
        </label>
        <label class="switch-toggle">
          <input type="checkbox" id="toggle-webp">
          <span class="switch-slider" aria-hidden="true"></span>
          <span class="switch-text">下载转JPG</span>
        </label>
        <label class="switch-toggle">
          <input type="checkbox" id="toggle-batch-zip-download">
          <span class="switch-slider" aria-hidden="true"></span>
          <span class="switch-text">批量下载ZIP</span>
        </label>
      </div>

      <div class="console-row row-formats">
        <div class="filter-formats" id="format-filters">
          <span class="format-loading">格式统计中...</span>
        </div>
      </div>

      <div class="console-row row-resolution">
        <div class="resolution-presets" id="resolution-presets">
          <button type="button" class="preset-chip active" data-preset="all">全部</button>
          <button type="button" class="preset-chip" data-preset="720p">≥ 720P</button>
          <button type="button" class="preset-chip" data-preset="1080p">≥ 1080P</button>
          <button type="button" class="preset-chip" data-preset="2k">≥ 2K</button>
          <button type="button" class="preset-chip" data-preset="4k">≥ 4K</button>
        </div>
        <div class="filter-group">
          <label class="metric-filter">
            <span>最小短边</span>
            <input type="number" id="filter-min-short" min="0" value="0">
          </label>
          <label class="metric-filter">
            <span>最小长边</span>
            <input type="number" id="filter-min-long" min="0" value="0">
          </label>
          <label class="metric-filter">
            <span>最小像素</span>
            <select id="filter-min-mp">
              <option value="0">不限</option>
              <option value="500000">≥ 0.50 MP</option>
              <option value="921600">≥ 0.92 MP</option>
              <option value="1000000">≥ 1.00 MP</option>
              <option value="2073600">≥ 2.07 MP</option>
              <option value="3686400">≥ 3.69 MP</option>
              <option value="8294400">≥ 8.29 MP</option>
              <option value="12000000">≥ 12.00 MP</option>
              <option value="24000000">≥ 24.00 MP</option>
            </select>
          </label>
        </div>
      </div>

      <div class="console-row row-actions">
        <button id="btn-select-all" class="btn btn-neutral">全选</button>
        <button id="btn-copy-selected" class="btn btn-info" disabled>批量复制链接</button>
        <button id="btn-download-selected" class="btn btn-success" disabled>批量下载</button>
        <button id="btn-open-download-dir" class="btn btn-secondary">打开下载目录</button>
        <span class="action-status" id="action-status"></span>
      </div>
    </header>

    <main class="image-grid" id="image-grid">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">PIC</div>
        <p>点击「开始扫描」获取本页图片</p>
      </div>
    </main>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-backdrop"></div>
    <div class="lightbox-content">
      <button id="lightbox-prev" class="lightbox-nav lightbox-nav-prev" type="button" aria-label="上一张">‹</button>
      <img id="lightbox-image" src="" alt="Preview">
      <button id="lightbox-next" class="lightbox-nav lightbox-nav-next" type="button" aria-label="下一张">›</button>
      <div class="lightbox-info">
        <span id="lightbox-dimensions"></span>
        <span id="lightbox-size"></span>
      </div>
      <div class="lightbox-actions">
        <button id="lightbox-download" class="btn btn-success">下载</button>
        <button id="lightbox-copy" class="btn btn-info">复制</button>
        <button id="lightbox-source" class="btn btn-secondary">图片来源</button>
        <button id="lightbox-close" class="btn btn-secondary">关闭</button>
      </div>
    </div>
  </div>

  <script src="../shared/i18n.js"></script>
  <script src="popup.js"></script>
  <script src="popup-i18n.js"></script>
</body>
</html>
